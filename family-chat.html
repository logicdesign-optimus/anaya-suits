<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9D</text></svg>">
<style>
  :root{
    --ink:#2a1f2b;
    --paper:#fdf8f4;
    --accent:#9b2d5e;
    --accent-dark:#7a2049;
    --muted:#6f6570;
    --line:#eee0e5;
    --bubble-user:#9b2d5e;
    --bubble-bot:#f3e9ed;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .notes{
    width:100%;max-width:640px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:28px;
  }
  .notes h1{font-size:1.15rem;margin-bottom:4px;font-weight:700;}
  .notes .hint{color:var(--muted);font-size:0.88rem;margin-bottom:18px;}
  .notes form{display:flex;flex-direction:column;gap:12px;}
  .notes input{
    padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:0.95rem;background:#fff;width:100%;
  }
  .fc-code{
    text-align:center;font-size:1.5rem;letter-spacing:12px;
    text-indent:12px;          /* re-centre: letter-spacing pads the last glyph */
    padding:14px;max-width:280px;
  }
  .btn{
    display:inline-block;background:var(--accent);color:#fff;
    padding:11px 22px;border-radius:8px;text-decoration:none;font-weight:600;
    border:none;cursor:pointer;font-size:0.95rem;transition:background .2s;
  }
  .btn:hover{background:var(--accent-dark);}
  .row{display:flex;gap:10px;align-items:center;}
  .status{font-size:0.85rem;color:var(--muted);min-height:1.2em;}
  .status.error{color:#b3261e;}
  .hidden{display:none !important;}

  .fc-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:14px;font-size:0.85rem;color:var(--muted);
  }
  .fc-signout{
    background:none;border:1px solid var(--line);border-radius:6px;
    padding:5px 12px;font-size:0.82rem;color:var(--muted);cursor:pointer;
    font-family:inherit;
  }
  .fc-signout:hover{border-color:var(--accent);color:var(--accent);}
  .fc-log{
    height:min(60vh,420px);overflow-y:auto;
    border:1px solid var(--line);border-radius:10px;
    padding:14px;display:flex;flex-direction:column;gap:10px;background:#fdfbfc;
  }
  .fc-msg{max-width:78%;display:flex;flex-direction:column;}
  .fc-msg .who{font-size:0.72rem;color:var(--muted);margin-bottom:3px;padding:0 4px;}
  .fc-msg .text{
    padding:9px 13px;border-radius:12px;font-size:0.93rem;
    white-space:pre-wrap;word-break:break-word;
  }
  .fc-msg.them{align-self:flex-start;}
  .fc-msg.them .text{background:var(--bubble-bot);color:var(--ink);border-bottom-left-radius:4px;}
  .fc-msg.me{align-self:flex-end;align-items:flex-end;}
  .fc-msg.me .text{background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px;}
  .fc-empty{color:var(--muted);font-size:0.88rem;margin:auto;text-align:center;}
  .fc-compose{display:flex;gap:10px;margin-top:14px;}
  .fc-compose input{flex:1;}
  /* .notes form sets column for the sign-in box and outranks .fc-compose */
  .notes .fc-compose{flex-direction:row;align-items:center;}
  .fc-attach[hidden]{display:none;}

  /* attachments */
  .fc-msg .who{display:flex;align-items:center;gap:6px;}
  .fc-msg.me .who{justify-content:flex-end;}
  .fc-del{
    border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:0.95rem;line-height:1;padding:0 2px;opacity:0;transition:opacity .15s;
  }
  .fc-msg:hover .fc-del,.fc-del:focus{opacity:1;}
  .fc-del:hover{color:#b3261e;}
  .fc-shot{
    max-width:100%;border-radius:10px;display:block;cursor:zoom-in;
    margin-bottom:6px;background:var(--bubble-bot);
  }
  .fc-clip{
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:42px;border:1px solid var(--line);border-radius:8px;
    cursor:pointer;font-size:1.05rem;background:#fff;
  }
  .fc-clip:hover{border-color:var(--accent);}
  .fc-attach{
    display:flex;align-items:center;gap:10px;margin-top:12px;
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fdfbfc;
  }
  .fc-attach img{width:38px;height:38px;object-fit:cover;border-radius:6px;}
  .fc-attach span{font-size:0.82rem;color:var(--muted);flex:1;}
  .fc-attach button{
    border:none;background:none;color:var(--muted);
    font-size:1.2rem;cursor:pointer;padding:0 4px;line-height:1;
  }
  .fc-shade{
    position:fixed;inset:0;z-index:200;display:none;
    background:rgba(28,18,26,0.9);align-items:center;justify-content:center;padding:24px;
  }
  .fc-shade.open{display:flex;}
  .fc-shade img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:10px;}
  .fc-shade .x{
    position:absolute;top:16px;right:20px;background:none;border:none;
    color:#fdf8f4;font-size:2rem;cursor:pointer;line-height:1;padding:4px 10px;
  }

  @media (max-width:560px){
    body{padding:0;align-items:stretch;}
    .notes{border:none;border-radius:0;padding:20px;min-height:100vh;}
  }
</style>
</head>
<body>

<div class="notes">
  <h1>Notes</h1>
  <p class="hint">Sign in to view.</p>

  <!-- Signed out -->
  <div id="fcAuth">
    <form id="fcSignInForm">
      <input type="password" id="fcCode" class="fc-code" placeholder="••••••"
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             autocomplete="one-time-code" aria-label="Code" required>
      <div class="row">
        <button type="submit" class="btn">Sign in</button>
        <span class="status" id="fcAuthStatus"></span>
      </div>
    </form>
  </div>

  <!-- Signed in -->
  <div id="fcPanel" class="hidden">
    <div class="fc-bar">
      <span id="fcWho"></span>
      <button type="button" class="fc-signout" id="fcSignOut">Sign out</button>
    </div>
    <div class="fc-log" id="fcLog">
      <div class="fc-empty" id="fcEmpty">No entries yet.</div>
    </div>
    <div class="fc-attach" id="fcAttach" hidden>
      <img id="fcAttachThumb" alt="">
      <span id="fcAttachName"></span>
      <button type="button" id="fcAttachClear" aria-label="Remove photo">&times;</button>
    </div>
    <form class="fc-compose" id="fcSendForm">
      <label class="fc-clip" for="fcFile" title="Attach a photo">📎</label>
      <input type="file" id="fcFile" accept="image/*" hidden>
      <input type="text" id="fcInput" placeholder="Write something…" autocomplete="off">
      <button type="submit" class="btn" style="padding:11px 20px;">Send</button>
    </form>
    <div class="status" id="fcSendStatus"></div>
  </div>
</div>

<div class="fc-shade" id="fcShade" role="dialog" aria-modal="true" aria-label="Photo">
  <button type="button" class="x" id="fcShadeClose" aria-label="Close">&times;</button>
  <img id="fcShadeImg" src="" alt="">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ---- Firebase config: must match the one in contact.html (same project, same accounts) ----
var firebaseConfig = {
  apiKey: "AIzaSyBZSBxFF0U4L9ksSeqnX8SNbo6QyKc8rv8",
  authDomain: "skynet-465a0.firebaseapp.com",
  databaseURL: "https://skynet-465a0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "skynet-465a0",
  storageBucket: "skynet-465a0.firebasestorage.app",
  messagingSenderId: "150827747633",
  appId: "1:150827747633:web:334e7888a052ef2e6b8810",
  measurementId: "G-13QJJV0TKG"
};

// One entry per person. Each has their own 6-digit code, and that code IS
// the account password - nothing is appended. (Firebase demands at least 6
// characters, which six digits meets exactly.) Create both in Firebase console
// -> Authentication -> Users -> Add user, using these exact addresses. The
// addresses never receive mail. "name" is only the label shown on messages.
//
// Sign-in tries each account in turn, so the code alone identifies the person
// and the box on screen stays a single field. Keep this list short -- every
// extra person is another attempt on a wrong code.
var FC_PEOPLE = [
  { email: "person-one@anayasuits.example", name: "Person One" },
  { email: "person-two@anayasuits.example", name: "Person Two" }
];
var FC_BUILD = "2026-09-28b";   // shown in the console, to confirm which copy loaded

// Shared with contact.html - same database path, same conversation.
// Thumbnails ride along in the message; full-size photos live in a separate
// node so opening the board does not download every picture ever posted.
var FC_PATH = "family-chat/messages";
var FC_IMGS = "family-chat/images";

var FC_FULL_PX = 1200, FC_FULL_Q = 0.72;   // stored, shown when a photo is tapped
var FC_THUMB_PX = 420, FC_THUMB_Q = 0.6;   // inline in the thread

(function(){
  var authBox    = document.getElementById('fcAuth');
  var panel      = document.getElementById('fcPanel');
  var signInForm = document.getElementById('fcSignInForm');
  var codeEl     = document.getElementById('fcCode');
  var authStatus = document.getElementById('fcAuthStatus');
  var sendStatus = document.getElementById('fcSendStatus');
  var whoEl      = document.getElementById('fcWho');
  var signOutBtn = document.getElementById('fcSignOut');
  var log        = document.getElementById('fcLog');
  var emptyEl    = document.getElementById('fcEmpty');
  var sendForm   = document.getElementById('fcSendForm');
  var input      = document.getElementById('fcInput');
  var fileEl     = document.getElementById('fcFile');
  var attachBox  = document.getElementById('fcAttach');
  var attachImg  = document.getElementById('fcAttachThumb');
  var attachName = document.getElementById('fcAttachName');
  var attachX    = document.getElementById('fcAttachClear');
  var shade      = document.getElementById('fcShade');
  var shadeImg   = document.getElementById('fcShadeImg');
  var shadeX     = document.getElementById('fcShadeClose');

  var msgRef = null;
  var pendingFull = null, pendingThumb = null;
  var me = null;                             // { uid, name } once signed in

  function setStatus(el, text, isError){
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }

  // A base64 data URL carries about 3 bytes for every 4 characters.
  function kb(dataUrl){ return Math.round(dataUrl.length * 0.75 / 1024); }

  function personFor(email){
    for (var i = 0; i < FC_PEOPLE.length; i++) {
      if (FC_PEOPLE[i].email === email) return FC_PEOPLE[i];
    }
    return null;
  }

  // Work out up front whether we can run at all, and if not, why. Reporting the
  // reason on every keystroke beats returning early and leaving the box inert.
  var fatal = '';
  if (typeof firebase === 'undefined') {
    fatal = 'Sign-in could not load. Check the connection, or an ad blocker.';
  } else if (firebaseConfig.apiKey === "REPLACE_ME") {
    fatal = 'Not configured yet.';
  }

  var auth, db;
  if (!fatal) {
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db   = firebase.database();
    } catch (e) {
      fatal = 'Setup problem: ' + (e && e.message ? e.message : e);
    }
  }

  if (fatal) {
    setStatus(authStatus, fatal, true);
    signInForm.addEventListener('submit', function(e){
      e.preventDefault(); setStatus(authStatus, fatal, true);
    });
    codeEl.addEventListener('input', function(){ setStatus(authStatus, fatal, true); });
    if (window.console) console.error('Notes build ' + FC_BUILD + ': ' + fatal);
    return;
  }
  if (window.console) console.log('Notes build ' + FC_BUILD + ' ready');

  function timeOf(ts){
    if (!ts) return '';
    var d = new Date(ts);
    return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  }

  // ---- photos -------------------------------------------------------------

  // Draw the picture into a canvas at a smaller size and re-encode as JPEG.
  // Nothing full-resolution ever leaves the browser.
  function shrink(file, maxPx, quality, done){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { done(c.toDataURL('image/jpeg', quality)); }
      catch(e){ done(null); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  function clearAttachment(){
    pendingFull = pendingThumb = null;
    attachImg.removeAttribute('src');
    attachName.textContent = '';
    attachBox.hidden = true;
  }

  fileEl.addEventListener('change', function(){
    var f = fileEl.files && fileEl.files[0];
    fileEl.value = '';                       // so the same file can be picked twice
    if (!f) return;
    if (f.type.indexOf('image/') !== 0) {
      setStatus(sendStatus, 'Photos only.', true);
      return;
    }
    setStatus(sendStatus, 'Preparing photo…');
    shrink(f, FC_FULL_PX, FC_FULL_Q, function(full){
      if (!full) { setStatus(sendStatus, 'Could not read that image.', true); return; }
      shrink(f, FC_THUMB_PX, FC_THUMB_Q, function(thumb){
        pendingFull  = full;
        pendingThumb = thumb || full;
        attachImg.src = pendingThumb;
        attachName.textContent = kb(pendingFull) + ' KB';
        attachBox.hidden = false;
        setStatus(sendStatus, '');
      });
    });
  });

  attachX.addEventListener('click', clearAttachment);

  function openShot(key, thumb){
    shadeImg.src = thumb;                    // instant, then swap for the full one
    shade.classList.add('open');
    shadeX.focus();
    db.ref(FC_IMGS + '/' + key).once('value').then(function(s){
      var full = s.val();
      if (full && shade.classList.contains('open')) shadeImg.src = full;
    }).catch(function(){});
  }
  function closeShot(){ shade.classList.remove('open'); shadeImg.removeAttribute('src'); }

  shadeX.addEventListener('click', closeShot);
  shade.addEventListener('click', function(e){ if (e.target === shade) closeShot(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && shade.classList.contains('open')) closeShot();
  });

  // ---- thread -------------------------------------------------------------

  function showEmpty(){
    if (log.querySelector('.fc-msg')) return;
    log.innerHTML = '';
    emptyEl = document.createElement('div');
    emptyEl.className = 'fc-empty';
    emptyEl.textContent = 'No entries yet.';
    log.appendChild(emptyEl);
  }

  function removeMsg(key, hasPhoto){
    if (!window.confirm('Delete this message?')) return;
    // image first: the rules let the author clear it, and the message is the record
    var first = hasPhoto ? db.ref(FC_IMGS + '/' + key).remove() : Promise.resolve();
    first.then(function(){ return db.ref(FC_PATH + '/' + key).remove(); })
         .catch(function(err){
           setStatus(sendStatus, 'Could not delete: ' + err.message, true);
         });
  }

  function render(key, msg){
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var mine = !!(me && msg.uid && msg.uid === me.uid);

    var wrap = document.createElement('div');
    wrap.className = 'fc-msg ' + (mine ? 'me' : 'them');
    wrap.setAttribute('data-key', key);

    var who = document.createElement('div');
    who.className = 'who';
    var stamp = document.createElement('span');
    var label = msg.by || 'someone';
    stamp.textContent = label + (msg.ts ? ' · ' + timeOf(msg.ts) : '');
    who.appendChild(stamp);
    if (mine) {
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'fc-del';
      del.textContent = '×';
      del.title = 'Delete';
      del.setAttribute('aria-label', 'Delete message');
      del.addEventListener('click', function(){ removeMsg(key, !!msg.thumb); });
      who.appendChild(del);
    }
    wrap.appendChild(who);

    if (msg.thumb) {
      var shot = document.createElement('img');
      shot.className = 'fc-shot';
      shot.src = msg.thumb;
      shot.alt = 'Photo from ' + label;
      shot.addEventListener('click', function(){ openShot(key, msg.thumb); });
      wrap.appendChild(shot);
    }

    if (msg.text) {
      var text = document.createElement('div');
      text.className = 'text';
      text.textContent = msg.text;
      wrap.appendChild(text);
    }

    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function attach(){
    msgRef = db.ref(FC_PATH).orderByChild('ts').limitToLast(200);
    msgRef.on('child_added', function(snap){
      render(snap.key, snap.val() || {});
    }, function(err){
      setStatus(sendStatus, 'Could not load notes: ' + err.message, true);
    });
    msgRef.on('child_removed', function(snap){
      var el = log.querySelector('[data-key="' + snap.key + '"]');
      if (el) el.remove();
      showEmpty();
    });
  }

  function detach(){
    if (msgRef) { msgRef.off(); msgRef = null; }
    log.innerHTML = '';
    emptyEl = null;
    showEmpty();
  }

  // ---- sign in ------------------------------------------------------------

  var submitting = false;

  // The code is the only thing typed, so work out whose it is by trying each
  // account in turn. First one that accepts it wins.
  function tryPerson(i, code, done){
    if (i >= FC_PEOPLE.length) { done('Wrong code.'); return; }
    auth.signInWithEmailAndPassword(FC_PEOPLE[i].email, code)
      .then(function(){ done(null); })
      .catch(function(err){
        var c = (err && err.code) || '';
        if (c === 'auth/too-many-requests') { done('Too many tries. Wait a few minutes.'); return; }
        if (c === 'auth/wrong-password' ||
            c === 'auth/invalid-credential' ||
            c === 'auth/invalid-login-credentials' ||
            c === 'auth/user-not-found') { tryPerson(i + 1, code, done); return; }
        done(err.message);
      });
  }

  function submitCode(){
    var code = codeEl.value.trim();
    if (submitting || !/^[0-9]{6}$/.test(code)) return;
    submitting = true;
    setStatus(authStatus, 'Checking…');
    tryPerson(0, code, function(problem){
      submitting = false;
      if (!problem) { codeEl.value = ''; return; }
      setStatus(authStatus, problem, true);
      codeEl.value = '';
      codeEl.focus();
    });
  }

  signInForm.addEventListener('submit', function(e){ e.preventDefault(); submitCode(); });

  // Six digits is the whole code, so there is nothing to confirm with a button press.
  codeEl.addEventListener('input', function(){
    codeEl.value = codeEl.value.replace(/[^0-9]/g, '').slice(0, 6);
    setStatus(authStatus, '');
    if (codeEl.value.length === 6) submitCode();
  });

  signOutBtn.addEventListener('click', function(){ auth.signOut(); });

  // ---- sending ------------------------------------------------------------

  sendForm.addEventListener('submit', function(e){
    e.preventDefault();
    if (!auth.currentUser || !me) return;
    var text = input.value.trim();
    if (!text && !pendingFull) return;       // nothing typed and nothing attached

    var full = pendingFull, thumb = pendingThumb;
    input.value = '';
    clearAttachment();
    setStatus(sendStatus, full ? 'Sending photo…' : '');

    var key = db.ref(FC_PATH).push().key;
    var payload = {
      uid: me.uid,                           // the rules check this against the signed-in user
      by:  me.name,
      ts:  firebase.database.ServerValue.TIMESTAMP
    };
    if (text)  payload.text  = text;
    if (thumb) payload.thumb = thumb;

    // message first, so the photo always has a record that owns it
    db.ref(FC_PATH + '/' + key).set(payload)
      .then(function(){ return full ? db.ref(FC_IMGS + '/' + key).set(full) : null; })
      .then(function(){ setStatus(sendStatus, ''); })
      .catch(function(err){
        setStatus(sendStatus, 'Not sent: ' + err.message, true);
        if (text) input.value = text;        // hand the words back; the photo is gone
      });
  });

  // Firebase keeps the session in this browser, so a return visit stays signed in.
  auth.onAuthStateChanged(function(user){
    if (user) {
      var person = personFor(user.email);
      me = { uid: user.uid, name: (person && person.name) || 'someone' };
      setStatus(authStatus, '');
      authBox.classList.add('hidden');
      panel.classList.remove('hidden');
      whoEl.textContent = 'Signed in as ' + me.name;
      detach();
      attach();
    } else {
      me = null;
      detach();
      closeShot();
      clearAttachment();
      panel.classList.add('hidden');
      authBox.classList.remove('hidden');
      whoEl.textContent = '';
      setStatus(sendStatus, '');
      codeEl.value = '';
    }
  });
})();
</script>

</body>
</html>
